name: Plotus
packages:
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS.git
    exactVersion: 10.1.0
configFiles:
  Debug: Configuration.xcconfig
  Release: Configuration.xcconfig
options:
  bundleIdPrefix: com.plotus
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    MARKETING_VERSION: '0.1.0'
    CURRENT_PROJECT_VERSION: '1'
    GENERATE_INFOPLIST_FILE: NO
    INFOPLIST_FILE: Info.plist
    TARGETED_DEVICE_FAMILY: '1,2'
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    FRAMEWORK_SEARCH_PATHS: '$(inherited) $(SRCROOT)/../client/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)'
    OTHER_LDFLAGS: '$(inherited) -framework PlotusApp'
targets:
  Plotus:
    type: application
    platform: iOS
    sources: [Sources, Resources]
    dependencies:
      - package: GoogleSignIn
        product: GoogleSignIn
    preBuildScripts:
      - name: Build shared Kotlin UI
        script: |
          cd "$SRCROOT/../.."
          ./gradlew :composeApp:embedAndSignAppleFrameworkForXcode
        basedOnDependencyAnalysis: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.plotus.app
        CODE_SIGN_ENTITLEMENTS: Plotus.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
schemes:
  Plotus:
    build:
      targets:
        Plotus: all
