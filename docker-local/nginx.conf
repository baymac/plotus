server {
    listen 8080;
    server_name _;
    absolute_redirect off;
    root /usr/share/nginx/html;
    index index.html;
    include /etc/nginx/mime.types;
    types { application/javascript mjs; }
    location = /health { access_log off; return 200 "ok\n"; add_header Content-Type text/plain; }
    location /api/auth/ { proxy_pass http://auth:4001; proxy_set_header Host $http_host; proxy_set_header Origin $http_origin; }
    location = /.well-known/jwks.json { proxy_pass http://auth:4001; }
    location /v1/ { proxy_pass http://api:4000; }
    location = /_session-check {
        internal;
        proxy_pass http://auth:4001/api/auth/token/csrf;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Origin http://localhost:8081;
    }
    location ~ ^/(projects|settings(/(general|account))?)/?$ {
        auth_request /_session-check;
        error_page 401 403 = @login;
        try_files /_app/index.html =404;
        add_header Cache-Control "private, no-store" always;
        add_header X-Content-Type-Options nosniff always;
    }
    location @login { return 302 /login?next=$uri; }
    location = /login { try_files /_app/index.html =404; add_header Cache-Control "private, no-store" always; }
    location = /login/ { return 302 /login$is_args$args; }
    location = /_app { return 302 /projects; }
    location = /_app/ { return 302 /projects; }
    location = /_app/index.html { return 302 /projects; }
    error_page 404 /404.html;
    location / { try_files $uri $uri/ =404; }
    add_header X-Content-Type-Options nosniff always;
}
