server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    include /etc/nginx/mime.types;
    types { application/javascript mjs; }
    location = /health { access_log off; return 200 "ok\n"; add_header Content-Type text/plain; }
    location /api/auth/ { proxy_pass http://auth:4001; proxy_set_header Host $http_host; proxy_set_header Origin $http_origin; }
    location = /.well-known/jwks.json { proxy_pass http://auth:4001; }
    location /v1/ { proxy_pass http://api:4000; }
    location / { try_files $uri $uri/ /index.html; }
    add_header X-Content-Type-Options nosniff always;
}
