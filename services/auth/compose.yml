name: plotus-auth
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: plotus_auth
      POSTGRES_USER: plotus_auth
      POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD:?Run scripts/init-local.sh first}
    ports: ["127.0.0.1:5441:5432"]
    volumes: ["auth-db:/var/lib/postgresql/data"]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U plotus_auth -d plotus_auth"]
      interval: 5s
      timeout: 3s
      retries: 12
  redis:
    image: redis:7-alpine
    command: [redis-server, --save, "", --appendonly, "no"]
    ports: ["127.0.0.1:6381:6379"]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 12
  auth:
    build: .
    user: "${PLOTUS_AUTH_UID:-10001}:${PLOTUS_AUTH_GID:-10001}"
    command: [sh, -c, "plotus-auth -migrate && exec plotus-auth"]
    ports: ["127.0.0.1:4001:4001"]
    environment:
      AUTH_ADDRESS: 0.0.0.0:4001
      AUTH_DATABASE_URL: postgres://plotus_auth:${AUTH_DB_PASSWORD}@postgres:5432/plotus_auth?sslmode=disable
      AUTH_REDIS_URL: redis://redis:6379/0
      AUTH_SIGNING_KEY_FILE: /run/plotus-signing.pem
      AUTH_PUBLIC_URL: ${AUTH_PUBLIC_URL:-http://localhost:4001}
      AUTH_WEB_ORIGIN: ${AUTH_WEB_ORIGIN:-http://localhost:8081}
      AUTH_NATIVE_REDIRECTS: ${AUTH_NATIVE_REDIRECTS:-plotus://oauth/callback,http://127.0.0.1/callback}
      AUTH_ENV: ${AUTH_ENV:-development}
      WEBAUTHN_RP_ID: ${WEBAUTHN_RP_ID:-localhost}
      WEBAUTHN_ORIGINS: ${WEBAUTHN_ORIGINS:-http://localhost:8081}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
    volumes: ["./.local/signing-key.pem:/run/plotus-signing.pem:ro"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, "http://127.0.0.1:4001/health"]
      interval: 10s
      timeout: 5s
      retries: 6
volumes:
  auth-db:
